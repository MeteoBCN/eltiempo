name: Actualizar datos meteorológicos

on:
  schedule:
    # FASE DE DISEÑO: cada 10 minutos (en UTC), para iterar rápido mientras
    # solo tú ves la web. GitHub Actions no garantiza el minuto exacto en
    # horas de mucha carga, pero siempre se ejecuta dentro de esa franja.
    # ⚠️ Antes de abrir la web al público, volver a '0 */3 * * *' (cada 3h)
    # para no agotar los minutos de Actions si el repo es privado.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña "Actions"

# Permite que el workflow haga commit/push del JSON actualizado
permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar Open-Meteo y generar datos/meteo.json
        run: node scripts/actualizar-datos.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/meteo.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se hace commit."
          else
            git commit -m "Actualiza datos meteorológicos [automático]"
            git push
          fi
